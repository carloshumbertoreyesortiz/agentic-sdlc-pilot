name: decorate-matrix-issues

# US-075 INTERIM. Sets board fields, issue type and the epic link on
# Matrix-sourced issues in the SFB production repo.
#
# Why it runs from THIS repo rather than the production one: a workflow there
# would need an Actions secret (repo admin — the pilot has write), and the
# GitHub App cannot write Project fields (scoped to Issues + Metadata; adding
# Projects needs an org owner). Both routes wait on someone else, while the SFB
# team currently cannot see Status or Priority on incoming incidents at all.
#
# DELETE THIS once the App gains Projects permission and the workflow moves into
# the production repo as an event-driven job. See docs/matrix-sync-cutover.md.
#
# Polling, not events — this repo cannot receive the other repo's issue events.
# Every 10 minutes: ServiceNow polls at 2, so worst case an incident is
# undecorated for ~12 minutes.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would change without writing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: decorate-matrix-issues
  cancel-in-progress: false

jobs:
  decorate:
    runs-on: ubuntu-latest
    # `secrets` is NOT available in a step-level `if:` — GitHub rejects the whole
    # workflow file with "Unrecognized named-value: 'secrets'". It IS allowed in
    # `env:`, so the presence check is hoisted here and the step tests the env
    # var instead.
    env:
      APP_AUTH: ${{ secrets.SFB_APP_PRIVATE_KEY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund

      # Mint a short-lived installation token from the App rather than using a
      # personal token. Rationale, and why this replaces SFB_PROD_TOKEN:
      #   * the org rejects classic PATs outright
      #   * a PAT of any kind is bound to one person — Rune's warning applies:
      #     eviction of the owning user invalidates it, which is precisely the
      #     single-person dependency US-075 exists to remove
      #   * installation tokens renew themselves, so nothing expires on a date
      #     nobody is watching
      # `actions/create-github-app-token` is whitelisted on Telenor-managed orgs
      # (Nova GHEC guide, Appendix C).
      - name: Mint an installation token
        id: app-token
        if: env.APP_AUTH == 'yes'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SFB_APP_ID }}
          private-key: ${{ secrets.SFB_APP_PRIVATE_KEY }}
          owner: TelenorNorgeInternal
          repositories: s06065-sfb-telenor-sfdc

      - name: Decorate
        env:
          # App token when available; the PAT remains a fallback only so the job
          # keeps working during the changeover. Delete SFB_PROD_TOKEN once the
          # App path is confirmed — see docs/matrix-sync-cutover.md §5.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SFB_PROD_TOKEN }}
          TARGET_REPO: TelenorNorgeInternal/s06065-sfb-telenor-sfdc
          PROJECT_OWNER: TelenorNorgeInternal
          PROJECT_NUMBER: '408'
          EPIC_PREFIX: Incidents from Matrix
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No credential available — nothing decorated."
            echo "Preferred: set SFB_APP_ID and SFB_APP_PRIVATE_KEY (generate a"
            echo "private key on the matrix-sfb-sync App as an App manager)."
            exit 0
          fi
          npx tsx scripts/decorate-matrix-issues.ts ${{ inputs.dry_run && '--dry-run' || '' }}
